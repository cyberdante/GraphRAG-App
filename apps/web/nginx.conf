# Serves the built app and puts the API on the same origin.
#
# This mirrors what the Vite dev server does with its /api proxy, so the client
# code is identical in both: one origin, no CORS, no absolute API URL compiled
# into the bundle.

# ── Rate limits ────────────────────────────────────────────────────────────
#
# Three endpoints cost something a caller does not pay for, and each is capped
# separately because the sensible rate for one is wrong for the others.
#
# A question runs retrieval and then a model: slow, and billed. Uploads and
# queries are cheaper but abusable — a URL attachment makes this service fetch
# on a caller's behalf, which is bandwidth and reputation spent from here.
#
# Keyed on the client address, which is what this deployment has. Behind a proxy
# that would need to be the forwarded address instead, and taking it from a
# header a client controls is worse than not limiting at all.
limit_req_zone $binary_remote_addr zone=asking:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=uploading:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=querying:10m rate=60r/m;

# 429 rather than 503, which is what nginx sends by default: the caller asked
# too often, the service is not unavailable.
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A single-page app owns its routes, so anything that is not a real file
    # has to reach index.html rather than 404.
    #
    # index.html is never cached. It is the only file that names the hashed
    # bundles, so a cached copy pins a returning visitor to the build it was
    # fetched with — assets that may no longer exist after the next deploy.
    # This was not theoretical: a browser here held an index.html pointing at a
    # bundle three builds old, and every change appeared to have no effect.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The hashed assets are the opposite case: their name changes whenever their
    # content does, so they can be kept indefinitely.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Tenant documents are fetched at runtime rather than bundled, which is what
    # lets a deployment rebrand without a rebuild. They must not be cached as
    # aggressively as the hashed assets.
    location /tenants/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The vocabulary the exports point at. Without this the SPA fallback below
    # catches it and returns index.html, so a consumer following `isDefinedBy`
    # from an export receives the app shell instead of the ontology — a document
    # that promises to be resolvable and is not.
    location /ontology/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location = /api/query {
        include /etc/nginx/security-headers.conf;
        limit_req zone=asking burst=4 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /api/attachments {
        include /etc/nginx/security-headers.conf;
        limit_req zone=uploading burst=10 nodelay;
        # Large enough for the 2 MB per-file cap and a handful at once, small
        # enough that a body has to be plausible before the service reads it.
        client_max_body_size 12m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location = /api/graph/query {
        include /etc/nginx/security-headers.conf;
        limit_req zone=querying burst=20 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Answers arrive as server-sent events. Without these, nginx buffers the
        # whole response and the answer appears all at once at the end, which
        # looks like a hang and defeats the point of streaming.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
