# Included into every location block, and that repetition is the point.
#
# nginx does not merge add_header directives down: a location that sets any
# header of its own discards every one inherited from the server block. Setting
# these once at the top looked right, served them on nothing that had its own
# Cache-Control, and would have shipped a policy covering only the paths nobody
# had configured. Including them everywhere is how they are actually applied.

# script-src is 'self' with no escape hatch, which the build makes possible:
# index.html carries no inline script, only a module tag. style-src has to allow
# inline because emotion injects component styles at runtime; the stricter
# alternative is a per-response nonce, which a static file server cannot mint.
# That is a real gap, and it is this one rather than a general loosening.
#
# connect-src is 'self': the API is same-origin behind this proxy, and the one
# place the product reaches another origin is a URL attachment, fetched by the
# service under its own guard rather than by the browser.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

# Guessing a type is how a text upload becomes a script.
add_header X-Content-Type-Options "nosniff" always;

# A console whose URLs name a tenant should not leak them to wherever a link
# happens to point.
add_header Referrer-Policy "no-referrer" always;

# Nothing here uses a camera, a microphone or a location, and saying so costs a
# line.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
