[project]
name = "ragstone-api"
version = "0.1.0"
description = "GraphRAG service: streams answers from Bedrock over a Neptune knowledge graph."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    # Multipart form parsing, which is how a file upload arrives. FastAPI needs
    # it present to declare an UploadFile at all, so it is a hard dependency
    # rather than an extra.
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
llm = [
    "litellm>=1.55",
]
# openCypher over Bolt: Neo4j locally, Neptune when deployed.
graph = [
    "neo4j>=5.26",
]
aws = [
    "boto3>=1.35",
    "requests-aws4auth>=1.3",
]
dev = [
    "anyio>=4.6",
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Calling these in argument defaults is how FastAPI declares dependencies and
# parameter metadata. B008 exists to catch mutable defaults, which these are not.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Starlette's TestClient still imports httpx 0.x. Nothing to act on until
    # FastAPI moves; failing CI over someone else's deprecation helps no one.
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]
