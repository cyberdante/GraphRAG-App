name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:web

      - name: Build
        run: pnpm build

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts

      - name: Test
        run: pytest

  # What the unit suites cannot see. jsdom does no layout and has no opinion
  # about perception, so a drawer opening behind the app bar and text at 4.19:1
  # both pass it — and both did, until a person noticed.
  #
  # Runs inside the same image the baselines were photographed in. Font
  # rasterisation differs between distributions, let alone between Linux and
  # macOS, so a screenshot compared across environments fails for reasons that
  # are not regressions. Pinning the image is what makes the comparison mean
  # something.
  appearance:
    name: Appearance and accessibility
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Install
        working-directory: .
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Browser checks
        run: pnpm e2e

      # Without this a visual failure is a red tick and nothing to look at.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # The store conformance suite skips the openCypher backend when no Bolt
  # endpoint is reachable, which keeps `pytest` useful on a laptop without
  # Docker. Somewhere has to actually run it, or "switchable backends" is only
  # ever asserted against the one store that needs no infrastructure.
  graph:
    name: Graph backends
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ragstone-dev
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ragstone-dev 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ragstone-dev
      # A skipped test must not pass for the job whose entire purpose is to run
      # the real store.
      RAGSTONE_REQUIRE_CYPHER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,graph]"

      - name: Seed the sample graph
        run: python scripts/seed_neo4j.py

      - name: Conformance
        run: pytest tests/test_store_conformance.py -v --no-header
